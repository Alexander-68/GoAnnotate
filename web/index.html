<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoAnnotate</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main class="workspace">
      <button id="openModalBtn" class="corner-btn btn ghost" type="button">Load</button>
      <div class="osd" id="osd"></div>
      <canvas id="canvas"></canvas>
    </main>
  </div>
  <div class="modal hidden" id="loadModal" aria-hidden="true">
    <div class="modal-scrim" data-close="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <a class="modal-title modal-link" id="modalTitle" href="https://github.com/Alexander-68/GoAnnotate" target="_blank" rel="noopener">GoAnnotate</a>
        <button class="modal-close" type="button" data-close="true">X</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Visualize and annotate YOLO11 detections and 17-keypoint pose labels directly against your local image set.</p>
        <div class="modal-section-title">Project Paths</div>
        
        <div class="field">
          <div class="field-header">
            <span>Images Dir</span>
            <button id="browseImagesBtn" class="btn ghost btn-sm" type="button">Browse</button>
          </div>
          <input id="imagesDir" type="text" list="imagesDirList" placeholder="C:\data\images" class="full-width-input" />
        </div>
        <datalist id="imagesDirList"></datalist>

        <div id="labelsSection" class="hidden">
          <div class="field">
            <div class="field-header">
              <span>Labels Dir</span>
              <button id="browseLabelsBtn" class="btn ghost btn-sm" type="button">Browse</button>
            </div>
            <input id="labelsDir" type="text" list="labelsDirList" placeholder="C:\data\labels" class="full-width-input" />
          </div>
          <datalist id="labelsDirList"></datalist>
        </div>

        <div id="folderPicker" class="folder-picker hidden">
          <div class="picker-header">
            <button id="pickerBackBtn" class="btn ghost btn-sm" type="button">&larr; Up</button>
            <span id="pickerCurrentPath" class="picker-path"></span>
          </div>
          <div id="pickerList" class="picker-list"></div>
          <div class="picker-actions">
            <button id="pickerCancelBtn" class="btn ghost btn-sm" type="button">Cancel</button>
            <button id="pickerSelectBtn" class="btn ghost btn-sm" type="button">Select Current</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="confirmLoadBtn" class="btn ghost" type="button">Load</button>
      </div>
    </div>
  </div>
  <script src="labels.js"></script>
  <script src="app.js"></script>
</body>
</html>
